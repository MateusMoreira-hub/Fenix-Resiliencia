<body>
     <img src="/IMAGE/Fenix.png" alt="Fênix" class="fenix">

     <script>
       segundos = 3; 

function atualizarContagem() {
  if (segundos > 0) {
    segundos--;
    setTimeout(atualizarContagem, 1000); 
  } else {
    window.location.href = "/HTML/burnwords.html";
  }
}

atualizarContagem();

     </script>
